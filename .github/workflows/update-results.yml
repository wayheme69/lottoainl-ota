name: Update NL results
on:
  schedule:
    # Samedi soir et dimanche (heure d'Amsterdam ≈ UTC+1/+2) : résultats publiés après le tirage de 18:04
    - cron: "15 17,18,19,20,21,22 * * 6"
    - cron: "0 6,12,18 * * 0"
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency: results
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/nl_results.py
      - run: |
          git config user.name "results-bot"; git config user.email "actions@github.com"
          git add nl_results.json history.json
          git diff --cached --quiet || (git commit -m "results $(date -u +%F)" && git push)
