name: Fetch URLs
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch.py
      - run: |
          git config user.name "results-bot"; git config user.email "actions@github.com"
          git add out; git commit -m "fetch" -q || true
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
